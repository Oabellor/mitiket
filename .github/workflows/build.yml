name: Build AEtickets APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Añadir plataforma Android
        run: npx cap add android

      - name: Sincronizar web → Android
        run: npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK debug
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AEtickets-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AEtickets.apk

      - name: Publicar Release con APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AEtickets (última versión)
          body: "Descarga AEtickets.apk desde el móvil e instálalo."
          files: AEtickets.apk
          make_latest: true
